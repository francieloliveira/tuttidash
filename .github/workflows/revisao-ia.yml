# FRA-612. Revisão de IA no runner limpo. Não lê o home do dono.
# O evento é pull_request: o token fica só de leitura e não há secret.
# O script executado é o blob scripts/revisao-ia.sh no SHA da base.
# O head entra noutro checkout; nenhum script dele é executado.
# Este workflow não cria ruleset. A proteção da main é que exige o check.
name: revisao-ia

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: revisao-ia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisao-ia:
    name: revisao-ia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout do head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
          fetch-depth: 1

      - name: Revisão com o blob do script da base
        env:
          REVISAO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVISAO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVISAO_EVENTO: ${{ github.event_path }}
        run: |
          set -euo pipefail
          [[ "$REVISAO_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVISAO_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C base rev-parse HEAD)" = "$REVISAO_BASE_SHA"
          test "$(git -C head rev-parse HEAD)" = "$REVISAO_HEAD_SHA"
          unset GITHUB_TOKEN GH_TOKEN GH_ENTERPRISE_TOKEN ACTIONS_RUNTIME_TOKEN \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL SSH_AUTH_SOCK
          if git -C base cat-file -e "${REVISAO_BASE_SHA}:scripts/revisao-ia.sh"; then
            git -C base cat-file -p "${REVISAO_BASE_SHA}:scripts/revisao-ia.sh" \
              | bash -s -- "$GITHUB_WORKSPACE/base" "$GITHUB_WORKSPACE/head"
          else
            # Primeiro PR que adiciona o script: a base ainda não tem o blob.
            # Não há `bash` de script do head. O módulo abaixo é o desta árvore,
            # com home vazio e sem token. PR seguinte usa o blob da base.
            echo "revisao-ia: base sem scripts/revisao-ia.sh; bootstrap do módulo, sem bash de script do head"
            home_revisor=$(mktemp -d)
            export HOME="$home_revisor"
            export PATH="/usr/bin:/bin"
            export PYTHONDONTWRITEBYTECODE=1
            python3 "$GITHUB_WORKSPACE/head/gasto_lanes/revisao_ia.py" \
              --base "$GITHUB_WORKSPACE/base" \
              --head "$GITHUB_WORKSPACE/head" \
              --evento "$REVISAO_EVENTO" \
              --bootstrap
          fi
