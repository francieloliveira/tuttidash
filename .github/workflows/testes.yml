name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferência de publicação
        run: tools/checar-publicacao.sh
      - name: Testes Python
        run: |
          python3 -m unittest discover -s tests -t .
          python3 -m unittest lanes.test_lanes
      - name: Testes Swift
        working-directory: apps/notch-mac
        run: swift test
